<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ルービックキューブ - ステップ1</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #1B1D21;
    color: #ECEAE4;
    font-family: 'Inter', sans-serif;
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }
  .header {
    width: 100%;
    max-width: 480px;
    text-align: left;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: #4FB6A8;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 6px;
  }
  #instructions {
    font-size: 14px;
    color: #8A8D96;
    margin: 0;
    line-height: 1.6;
  }
  .cube-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin-top: 20px;
  }
  #cube-container {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #232630;
    border: 1px solid #2F323C;
    touch-action: none;
    cursor: grab;
  }
  #cube-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .footer-row {
    width: 100%;
    max-width: 480px;
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #last-move {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8A8D96;
  }
  .button-group {
    display: flex;
    gap: 8px;
  }
  #reset-btn, #shuffle-btn, #recenter-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid #2F323C;
    color: #8A8D96;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  #shuffle-btn {
    border-color: #3A3320;
    color: #E0A458;
  }
  #reset-btn:disabled, #shuffle-btn:disabled, #recenter-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #reset-btn:hover:not(:disabled) {
    color: #ECEAE4;
    border-color: #4FB6A8;
  }
  #shuffle-btn:hover:not(:disabled) {
    color: #ECEAE4;
    border-color: #E0A458;
  }
  #recenter-btn:hover:not(:disabled) {
    color: #ECEAE4;
    border-color: #8A8D96;
  }
  .mode-switch {
    display: flex;
    gap: 8px;
    margin: 10px 0;
  }
  .mode-btn {
    background: transparent;
    border: 1px solid #2F323C;
    color: #8A8D96;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .mode-btn.active {
    background: #4FB6A8;
    border-color: #4FB6A8;
    color: #101114;
    font-weight: 600;
  }
  .hidden {
    display: none !important;
  }
  #phase-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #E85D9A;
    margin: 0 0 8px;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="eyebrow">3×3 CUBE — STEP 1</div>
      <h1>回転操作の確認</h1>
      <div class="mode-switch">
        <button id="mode-free-btn" class="mode-btn active">自由モード</button>
        <button id="mode-learn-btn" class="mode-btn">学習モード</button>
      </div>
      <p id="phase-info" class="hidden"></p>
      <p id="instructions">ステッカーを指でドラッグすると、その方向に列・行が回転します。背景をドラッグすると視点が回転します。ピンチ/ホイールで拡大縮小できます。</p>
    </div>
    <div class="cube-wrap">
      <div id="cube-container"></div>
    </div>
    <div class="footer-row">
      <div id="last-move" class="mono">操作なし</div>
      <div class="button-group">
        <button id="recenter-btn">⤾ 正面に戻す</button>
        <button id="shuffle-btn">🔀 シャッフル</button>
        <button id="reset-btn">↺ リセット</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const FACE_COLORS = {
    U: '#F5F3EE',
    D: '#F5C518',
    F: '#3C8C5E',
    B: '#1D5C9E',
    R: '#D7263D',
    L: '#F26430',
  };
  const BODY_COLOR = '#101114';

  const AXIS_VECTORS = {
    x: new THREE.Vector3(1, 0, 0),
    y: new THREE.Vector3(0, 1, 0),
    z: new THREE.Vector3(0, 0, 1),
  };
  // Centers never change which way they face (a move on their own layer
  // only ever spins them around their own axis), so this mapping is a
  // fixed ground truth for "where does color X belong" no matter how
  // scrambled the cube is.
  const FACE_HOME_DIR = {
    U: new THREE.Vector3(0, 1, 0),
    D: new THREE.Vector3(0, -1, 0),
    L: new THREE.Vector3(-1, 0, 0),
    R: new THREE.Vector3(1, 0, 0),
    F: new THREE.Vector3(0, 0, 1),
    B: new THREE.Vector3(0, 0, -1),
  };

  const AXIS_LAYER_NAMES = {
    x: { '1': 'R', '-1': 'L', '0': 'M' },
    y: { '1': 'U', '-1': 'D', '0': 'E' },
    z: { '1': 'F', '-1': 'B', '0': 'S' },
  };
  function moveLabel(axis, layer, angle) {
    const base = AXIS_LAYER_NAMES[axis][String(layer)];
    return angle < 0 ? base : base + '\u2032';
  }

  const COLUMN_TINT = 0x4fb6a8;
  const HINT_COLOR = 0xe85d9a;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function roundedRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function makeStickerTexture(hexColor) {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = hexColor;
    roundedRectPath(ctx, 6, 6, size - 12, size - 12, 20);
    ctx.fill();
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
  }

  const container = document.getElementById('cube-container');
  const instructionsEl = document.getElementById('instructions');
  const lastMoveEl = document.getElementById('last-move');
  const resetBtn = document.getElementById('reset-btn');
  const shuffleBtn = document.getElementById('shuffle-btn');
  const recenterBtn = document.getElementById('recenter-btn');
  const phaseInfoEl = document.getElementById('phase-info');
  const modeFreeBtn = document.getElementById('mode-free-btn');
  const modeLearnBtn = document.getElementById('mode-learn-btn');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const dom = renderer.domElement;
  container.appendChild(dom);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x202030, 0.65));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
  fillLight.position.set(-6, -3, -4);
  scene.add(fillLight);

  const cubeRoot = new THREE.Group();
  scene.add(cubeRoot);

  const textureCache = {};
  function getTexture(hex) {
    if (!textureCache[hex]) textureCache[hex] = makeStickerTexture(hex);
    return textureCache[hex];
  }

  const bodyGeometry = new THREE.BoxGeometry(0.94, 0.94, 0.94);
  const bodyMaterial = new THREE.MeshStandardMaterial({
    color: BODY_COLOR,
    roughness: 0.65,
    metalness: 0.05,
  });
  const stickerGeometry = new THREE.PlaneGeometry(0.8, 0.8);
  const stickerOffset = 0.475;

  const allCubies = [];
  let stickerMeshes = [];
  let animating = false;

  function addSticker(cubie, faceKey, normal) {
    const material = new THREE.MeshStandardMaterial({
      map: getTexture(FACE_COLORS[faceKey]),
      transparent: true,
      roughness: 0.45,
      metalness: 0,
    });
    const mesh = new THREE.Mesh(stickerGeometry, material);
    mesh.position.copy(normal.clone().multiplyScalar(stickerOffset));
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    mesh.userData.faceKey = faceKey;
    cubie.add(mesh);
  }

  function buildCube() {
    for (const c of [...allCubies]) {
      cubeRoot.remove(c);
      c.traverse((obj) => {
        if (obj.material && (obj.geometry === stickerGeometry || obj.geometry === bodyGeometry)) {
          obj.material.dispose();
        }
      });
    }
    allCubies.length = 0;

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          if (x === 0 && y === 0 && z === 0) continue;
          const cubie = new THREE.Group();
          cubie.position.set(x, y, z);
          cubie.add(new THREE.Mesh(bodyGeometry, bodyMaterial.clone()));
          const pieceFaces = [];
          if (x === 1) { addSticker(cubie, 'R', new THREE.Vector3(1, 0, 0)); pieceFaces.push('R'); }
          if (x === -1) { addSticker(cubie, 'L', new THREE.Vector3(-1, 0, 0)); pieceFaces.push('L'); }
          if (y === 1) { addSticker(cubie, 'U', new THREE.Vector3(0, 1, 0)); pieceFaces.push('U'); }
          if (y === -1) { addSticker(cubie, 'D', new THREE.Vector3(0, -1, 0)); pieceFaces.push('D'); }
          if (z === 1) { addSticker(cubie, 'F', new THREE.Vector3(0, 0, 1)); pieceFaces.push('F'); }
          if (z === -1) { addSticker(cubie, 'B', new THREE.Vector3(0, 0, -1)); pieceFaces.push('B'); }
          cubie.userData.pieceFaces = pieceFaces;
          cubeRoot.add(cubie);
          allCubies.push(cubie);
        }
      }
    }

    stickerMeshes = [];
    allCubies.forEach((c) => {
      c.children.forEach((child) => {
        if (child.geometry === stickerGeometry) stickerMeshes.push(child);
      });
    });
  }

  buildCube();

  function setLayerEmissive(axis, layer, on, color) {
    allCubies.forEach((c) => {
      if (Math.round(c.position[axis]) === layer) {
        c.traverse((obj) => {
          if (obj.material && obj.material.emissive) {
            obj.material.emissive.set(on ? color : 0x000000);
            obj.material.emissiveIntensity = on ? 0.55 : 0;
          }
        });
      }
    });
  }

  function snapCubie(cubie) {
    cubie.position.set(
      Math.round(cubie.position.x),
      Math.round(cubie.position.y),
      Math.round(cubie.position.z)
    );
    const m = new THREE.Matrix4().makeRotationFromQuaternion(cubie.quaternion);
    const el = m.elements;
    [0, 1, 2, 4, 5, 6, 8, 9, 10].forEach((i) => {
      el[i] = Math.round(el[i]);
    });
    cubie.quaternion.setFromRotationMatrix(m);
  }

  function setAnimating(v) {
    animating = v;
    resetBtn.disabled = v;
    shuffleBtn.disabled = v;
  }

  function animatePivotTo(pivot, axisVec, fromAngle, toAngle, layerCubies, duration, onDone) {
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = easeOutCubic(t);
      const angle = fromAngle + (toAngle - fromAngle) * eased;
      pivot.quaternion.setFromAxisAngle(axisVec, angle);
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        layerCubies.forEach((c) => {
          cubeRoot.attach(c);
          snapCubie(c);
        });
        cubeRoot.remove(pivot);
        if (onDone) onDone();
      }
    }
    requestAnimationFrame(step);
  }

  function performMove(axis, layer, angle, options) {
    options = options || {};
    if (animating && !options.chained) return;
    if (!options.chained) setAnimating(true);
    if (!options.silent) {
      lastMoveEl.textContent = '\u6700\u5f8c\u306e\u64cd\u4f5c: ' + moveLabel(axis, layer, angle);
    }
    const layerCubies = allCubies.filter((c) => Math.round(c.position[axis]) === layer);
    setLayerEmissive(axis, layer, true, COLUMN_TINT);
    const pivot = new THREE.Group();
    cubeRoot.add(pivot);
    layerCubies.forEach((c) => pivot.attach(c));
    const axisVec = AXIS_VECTORS[axis];
    const duration = options.duration || 230;
    animatePivotTo(pivot, axisVec, 0, angle, layerCubies, duration, () => {
      setLayerEmissive(axis, layer, false);
      if (!options.chained) {
        setAnimating(false);
        if (mode === 'learn') refreshLearnHint();
      }
      if (options.onComplete) options.onComplete();
    });
  }

  function scrambleCube(count, onComplete) {
    if (animating) return;
    clearHint();
    setAnimating(true);
    const axes = ['x', 'y', 'z'];
    let lastAxis = null;
    let lastLayer = null;
    const moves = [];
    for (let i = 0; i < count; i++) {
      let axis, layer;
      do {
        axis = axes[Math.floor(Math.random() * 3)];
        layer = Math.random() < 0.5 ? 1 : -1;
      } while (axis === lastAxis && layer === lastLayer);
      lastAxis = axis;
      lastLayer = layer;
      const angle = Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2;
      moves.push({ axis, layer, angle });
    }
    let idx = 0;
    lastMoveEl.textContent = '\u30b7\u30e3\u30c3\u30d5\u30eb\u4e2d...';
    function next() {
      if (idx >= moves.length) {
        setAnimating(false);
        lastMoveEl.textContent = '\u30b7\u30e3\u30c3\u30d5\u30eb\u5b8c\u4e86(' + count + '\u624b)';
        if (onComplete) onComplete();
        return;
      }
      const mv = moves[idx++];
      performMove(mv.axis, mv.layer, mv.angle, { chained: true, silent: true, duration: 140, onComplete: next });
    }
    next();
  }

  resetBtn.addEventListener('click', () => {
    if (animating) return;
    clearHint();
    buildCube();
    lastMoveEl.textContent = '\u64cd\u4f5c\u306a\u3057';
    if (mode === 'learn') {
      scrambleCube(20, refreshLearnHint);
    }
  });

  shuffleBtn.addEventListener('click', () => {
    scrambleCube(20, mode === 'learn' ? refreshLearnHint : undefined);
  });

  // --- learn mode: phase 1, the white cross ---
  const WHITE_EDGES = [['U', 'R'], ['U', 'L'], ['U', 'F'], ['U', 'B']];

  const hintMarkerGeom = new THREE.BoxGeometry(1.02, 1.02, 1.02);
  const hintMarker = new THREE.LineSegments(
    new THREE.EdgesGeometry(hintMarkerGeom),
    new THREE.LineBasicMaterial({ color: HINT_COLOR, transparent: true, opacity: 0.85 })
  );
  hintMarker.visible = false;
  scene.add(hintMarker);

  let mode = 'free';
  let hintCubie = null;

  function findCubieByFaces(faces) {
    return allCubies.find((c) => {
      const pf = c.userData.pieceFaces;
      return pf.length === faces.length && faces.every((f) => pf.includes(f));
    });
  }

  function getStickerWorldNormal(cubie, faceKey) {
    const mesh = cubie.children.find((m) => m.userData && m.userData.faceKey === faceKey);
    if (!mesh) return null;
    const n = new THREE.Vector3(0, 0, 1).transformDirection(mesh.matrixWorld);
    return new THREE.Vector3(Math.round(n.x), Math.round(n.y), Math.round(n.z));
  }

  function isEdgeSolved(pair) {
    const cubie = findCubieByFaces(pair);
    if (!cubie) return false;
    return pair.every((f) => {
      const n = getStickerWorldNormal(cubie, f);
      return n && n.equals(FACE_HOME_DIR[f]);
    });
  }

  function checkWhiteCross() {
    const unsolved = WHITE_EDGES.filter((pair) => !isEdgeSolved(pair));
    return { total: WHITE_EDGES.length, unsolved };
  }

  function clearHint() {
    if (hintCubie) {
      hintCubie.traverse((obj) => {
        if (obj.material && obj.material.emissive) {
          obj.material.emissive.set(0x000000);
          obj.material.emissiveIntensity = 0;
        }
      });
      hintCubie = null;
    }
    hintMarker.visible = false;
  }

  function showHintForEdge(pair) {
    clearHint();
    const cubie = findCubieByFaces(pair);
    if (!cubie) return;
    cubie.traverse((obj) => {
      if (obj.material && obj.material.emissive) {
        obj.material.emissive.set(HINT_COLOR);
        obj.material.emissiveIntensity = 0.55;
      }
    });
    hintCubie = cubie;

    const target = FACE_HOME_DIR[pair[0]].clone().add(FACE_HOME_DIR[pair[1]]);
    hintMarker.position.copy(target);
    hintMarker.visible = true;
  }

  function refreshLearnHint() {
    if (mode !== 'learn') return;
    const result = checkWhiteCross();
    const solved = result.total - result.unsolved.length;
    if (result.unsolved.length === 0) {
      clearHint();
      phaseInfoEl.textContent = '\u30d5\u30a7\u30fc\u30ba1: \u767d\u3044\u5341\u5b57 \u2014 \u5b8c\u6210\uff01(' + solved + '/' + result.total + ')';
      return;
    }
    phaseInfoEl.textContent = '\u30d5\u30a7\u30fc\u30ba1: \u767d\u3044\u5341\u5b57\u3092\u4f5c\u308d\u3046 (' + solved + '/' + result.total + ') \u2014 \u30d4\u30f3\u30af\u8272\u306e\u30d4\u30fc\u30b9\u3092\u3001\u679a\u306e\u4f4d\u7f6e\u307e\u3067\u52d5\u304b\u305d\u3046';
    showHintForEdge(result.unsolved[0]);
  }

  function setMode(next) {
    mode = next;
    modeFreeBtn.classList.toggle('active', mode === 'free');
    modeLearnBtn.classList.toggle('active', mode === 'learn');
    phaseInfoEl.classList.toggle('hidden', mode !== 'learn');
    if (mode === 'free') {
      clearHint();
    } else {
      scrambleCube(20, refreshLearnHint);
    }
  }
  modeFreeBtn.addEventListener('click', () => setMode('free'));
  modeLearnBtn.addEventListener('click', () => setMode('learn'));

  // --- camera orbit ---
  const DEFAULT_AZIMUTH = Math.PI / 4;
  const DEFAULT_POLAR = Math.PI / 3;
  const DEFAULT_RADIUS = 6.4;
  let azimuth = DEFAULT_AZIMUTH;
  let polar = DEFAULT_POLAR;
  let radius = DEFAULT_RADIUS;
  function updateCameraPosition() {
    camera.position.x = radius * Math.sin(polar) * Math.sin(azimuth);
    camera.position.y = radius * Math.cos(polar);
    camera.position.z = radius * Math.sin(polar) * Math.cos(azimuth);
    camera.lookAt(0, 0, 0);
  }
  updateCameraPosition();

  function getCameraAxes() {
    camera.updateMatrixWorld();
    const right = new THREE.Vector3();
    const up = new THREE.Vector3();
    const forward = new THREE.Vector3();
    camera.matrixWorld.extractBasis(right, up, forward);
    return { right, up };
  }

  function angularVelocity(axis, sign, point) {
    const omega = new THREE.Vector3();
    omega[axis] = sign;
    return omega.clone().cross(point);
  }

  recenterBtn.addEventListener('click', () => {
    azimuth = DEFAULT_AZIMUTH;
    polar = DEFAULT_POLAR;
    radius = DEFAULT_RADIUS;
    updateCameraPosition();
  });

  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  function getNDC(clientX, clientY) {
    const rect = dom.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * 2 - 1,
      y: -(((clientY - rect.top) / rect.height) * 2 - 1),
    };
  }

  // --- drag-to-rotate: drag a sticker in a direction to turn its layer,
  // drag the background to orbit the view (like a real cube app) ---
  const DRAG_LOCK_PX = 10;
  const DRAG_FULL_TURN_PX = 110;
  const MIN_RADIUS = 4.5;
  const MAX_RADIUS = 10;

  function buildDragCandidate(hit) {
    const mesh = hit.object;
    const cubie = mesh.parent;
    const worldNormal = new THREE.Vector3(0, 0, 1).transformDirection(mesh.matrixWorld);
    const axes = ['x', 'y', 'z'];
    let faceAxis = 'y';
    axes.forEach((a) => {
      if (Math.abs(worldNormal[a]) > 0.5) faceAxis = a;
    });
    const otherAxes = axes.filter((a) => a !== faceAxis);
    const [axisA, axisB] = otherAxes;
    const point = hit.point.clone();
    const camAxes = getCameraAxes();

    const vA = angularVelocity(axisA, 1, point);
    const vB = angularVelocity(axisB, 1, point);
    const verticalityA = Math.abs(vA.dot(camAxes.up));
    const verticalityB = Math.abs(vB.dot(camAxes.up));
    const colAxis = verticalityA >= verticalityB ? axisA : axisB;
    const rowAxis = colAxis === axisA ? axisB : axisA;
    const colLayer = Math.round(cubie.position[colAxis]);
    const rowLayer = Math.round(cubie.position[rowAxis]);

    const velColPlus = angularVelocity(colAxis, 1, point);
    const velColMinus = angularVelocity(colAxis, -1, point);
    const upAngle = velColPlus.dot(camAxes.up) >= velColMinus.dot(camAxes.up) ? Math.PI / 2 : -Math.PI / 2;
    const downAngle = -upAngle;

    const velRowPlus = angularVelocity(rowAxis, 1, point);
    const velRowMinus = angularVelocity(rowAxis, -1, point);
    const rightAngle = velRowPlus.dot(camAxes.right) >= velRowMinus.dot(camAxes.right) ? Math.PI / 2 : -Math.PI / 2;
    const leftAngle = -rightAngle;

    return {
      phase: 'pending',
      colAxis, colLayer, rowAxis, rowLayer,
      upAngle, downAngle, leftAngle, rightAngle,
      startX: 0, startY: 0,
    };
  }

  function lockDragDirection(dragState, clientX, clientY) {
    const dx = clientX - dragState.startX;
    const dy = clientY - dragState.startY;
    const horizontal = Math.abs(dx) >= Math.abs(dy);
    let axis, layer, targetAngle, sign;
    if (horizontal) {
      axis = dragState.rowAxis;
      layer = dragState.rowLayer;
      targetAngle = dx > 0 ? dragState.rightAngle : dragState.leftAngle;
      sign = Math.sign(dx) || 1;
    } else {
      axis = dragState.colAxis;
      layer = dragState.colLayer;
      targetAngle = dy < 0 ? dragState.upAngle : dragState.downAngle;
      sign = Math.sign(dy) || 1;
    }
    const layerCubies = allCubies.filter((c) => Math.round(c.position[axis]) === layer);
    const pivot = new THREE.Group();
    cubeRoot.add(pivot);
    layerCubies.forEach((c) => pivot.attach(c));
    setLayerEmissive(axis, layer, true, COLUMN_TINT);

    dragState.phase = 'active';
    dragState.horizontal = horizontal;
    dragState.axis = axis;
    dragState.layer = layer;
    dragState.targetAngle = targetAngle;
    dragState.sign = sign;
    dragState.pivot = pivot;
    dragState.layerCubies = layerCubies;
    dragState.lockX = clientX;
    dragState.lockY = clientY;
    dragState.lastProgress = 0;
    setAnimating(true);
  }

  function updateDragProgress(dragState, clientX, clientY) {
    const rawDelta = dragState.horizontal ? clientX - dragState.lockX : clientY - dragState.lockY;
    const progress = Math.max(0, Math.min(1, (rawDelta * dragState.sign) / DRAG_FULL_TURN_PX));
    dragState.lastProgress = progress;
    dragState.pivot.quaternion.setFromAxisAngle(AXIS_VECTORS[dragState.axis], dragState.targetAngle * progress);
  }

  function finishDrag(dragState) {
    if (dragState.phase !== 'active') return;
    const { axis, layer, targetAngle, pivot, layerCubies, lastProgress } = dragState;
    const finishToTarget = lastProgress >= 0.5;
    const fromAngle = targetAngle * lastProgress;
    const toAngle = finishToTarget ? targetAngle : 0;
    animatePivotTo(pivot, AXIS_VECTORS[axis], fromAngle, toAngle, layerCubies, 150, () => {
      setLayerEmissive(axis, layer, false);
      setAnimating(false);
      if (finishToTarget) {
        lastMoveEl.textContent = '\u6700\u5f8c\u306e\u64cd\u4f5c: ' + moveLabel(axis, layer, targetAngle);
      }
      if (mode === 'learn') refreshLearnHint();
    });
  }

  function cancelDrag(dragState) {
    if (dragState.phase !== 'active') return;
    const { axis, layer, targetAngle, pivot, layerCubies, lastProgress } = dragState;
    const fromAngle = targetAngle * lastProgress;
    animatePivotTo(pivot, AXIS_VECTORS[axis], fromAngle, 0, layerCubies, 120, () => {
      setLayerEmissive(axis, layer, false);
      setAnimating(false);
    });
  }

  const activePointers = new Map();
  let pinchStartDistance = 0;
  let pinchStartRadius = radius;
  let orbitPointerId = null;
  let orbitPrevX = 0;
  let orbitPrevY = 0;
  let pieceDrag = null;

  function pointerDistance() {
    const pts = [...activePointers.values()];
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  dom.addEventListener('pointerdown', (e) => {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size === 2) {
      if (pieceDrag) {
        cancelDrag(pieceDrag);
        pieceDrag = null;
      }
      orbitPointerId = null;
      pinchStartDistance = pointerDistance();
      pinchStartRadius = radius;
      return;
    }

    if (activePointers.size === 1) {
      if (animating) return;
      const ndc = getNDC(e.clientX, e.clientY);
      pointerNDC.set(ndc.x, ndc.y);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(stickerMeshes);
      if (hits.length > 0) {
        pieceDrag = buildDragCandidate(hits[0]);
        pieceDrag.startX = e.clientX;
        pieceDrag.startY = e.clientY;
        orbitPointerId = null;
      } else {
        pieceDrag = null;
        orbitPointerId = e.pointerId;
        orbitPrevX = e.clientX;
        orbitPrevY = e.clientY;
        container.style.cursor = 'grabbing';
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size === 2) {
      const dist = pointerDistance();
      if (pinchStartDistance > 0) {
        const scale = dist / pinchStartDistance;
        radius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, pinchStartRadius / scale));
        updateCameraPosition();
      }
      return;
    }

    if (pieceDrag) {
      if (pieceDrag.phase === 'pending') {
        const dx = e.clientX - pieceDrag.startX;
        const dy = e.clientY - pieceDrag.startY;
        if (Math.abs(dx) + Math.abs(dy) >= DRAG_LOCK_PX) {
          lockDragDirection(pieceDrag, e.clientX, e.clientY);
        }
      } else if (pieceDrag.phase === 'active') {
        updateDragProgress(pieceDrag, e.clientX, e.clientY);
      }
      return;
    }

    if (orbitPointerId === e.pointerId) {
      const dx = e.clientX - orbitPrevX;
      const dy = e.clientY - orbitPrevY;
      orbitPrevX = e.clientX;
      orbitPrevY = e.clientY;
      azimuth -= dx * 0.006;
      polar -= dy * 0.006;
      polar = Math.max(0.25, Math.min(Math.PI - 0.25, polar));
      updateCameraPosition();
    }
  });

  function endPointer(e) {
    activePointers.delete(e.pointerId);

    if (pieceDrag) {
      if (pieceDrag.phase === 'active') {
        finishDrag(pieceDrag);
      }
      pieceDrag = null;
    }
    if (orbitPointerId === e.pointerId) {
      orbitPointerId = null;
    }
    if (activePointers.size === 0) {
      container.style.cursor = 'grab';
    }
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  dom.addEventListener('wheel', (e) => {
    e.preventDefault();
    radius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, radius + e.deltaY * 0.003));
    updateCameraPosition();
  }, { passive: false });

  function resize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    if (w === 0 || h === 0) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  resize();
  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(container);

  function renderLoop() {
    renderer.render(scene, camera);
    requestAnimationFrame(renderLoop);
  }
  renderLoop();
})();
</script>
</body>
</html>
