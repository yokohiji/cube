<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ルービックキューブ - ステップ1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #1B1D21;
    color: #ECEAE4;
    font-family: 'Inter', sans-serif;
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }
  .header {
    width: 100%;
    max-width: 480px;
    text-align: left;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: #4FB6A8;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 6px;
  }
  #instructions {
    font-size: 14px;
    color: #8A8D96;
    margin: 0;
    line-height: 1.6;
  }
  #cube-container {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #232630;
    border: 1px solid #2F323C;
    touch-action: none;
    cursor: grab;
  }
  #cube-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .footer-row {
    width: 100%;
    max-width: 480px;
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #last-move {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8A8D96;
  }
  .button-group {
    display: flex;
    gap: 8px;
  }
  #reset-btn, #shuffle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid #2F323C;
    color: #8A8D96;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  #shuffle-btn {
    border-color: #3A3320;
    color: #E0A458;
  }
  #reset-btn:disabled, #shuffle-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #reset-btn:hover:not(:disabled) {
    color: #ECEAE4;
    border-color: #4FB6A8;
  }
  #shuffle-btn:hover:not(:disabled) {
    color: #ECEAE4;
    border-color: #E0A458;
  }
  .cube-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin-top: 20px;
  }
  #dpad {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: none;
    grid-template-columns: 40px 40px 40px;
    grid-template-rows: 40px 40px 40px;
    gap: 4px;
  }
  #dpad.visible {
    display: grid;
  }
  #dpad button {
    background: rgba(35, 38, 48, 0.9);
    border: 1px solid #3a3f4a;
    color: #ECEAE4;
    border-radius: 8px;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    backdrop-filter: blur(2px);
  }
  #dpad button:hover {
    border-color: #4FB6A8;
  }
  #dpad button:active {
    transform: scale(0.94);
  }
  #dpad-up { grid-column: 2; grid-row: 1; }
  #dpad-left { grid-column: 1; grid-row: 2; }
  #dpad-right { grid-column: 3; grid-row: 2; }
  #dpad-down { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="eyebrow">3×3 CUBE — STEP 1</div>
      <h1>回転操作の確認</h1>
      <p id="instructions">キューブのステッカーをタップすると、その列(青緑)と行(黄土色)がハイライトされ、上下左右の矢印が表示されます。ドラッグでビューを回転、ピンチ/ホイールで拡大縮小できます。</p>
    </div>
    <div class="cube-wrap">
      <div id="cube-container"></div>
      <div id="dpad">
        <button id="dpad-up">↑</button>
        <button id="dpad-left">←</button>
        <button id="dpad-right">→</button>
        <button id="dpad-down">↓</button>
      </div>
    </div>
    <div class="footer-row">
      <div id="last-move" class="mono">操作なし</div>
      <div class="button-group">
        <button id="shuffle-btn">🔀 シャッフル</button>
        <button id="reset-btn">↺ リセット</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const FACE_COLORS = {
    U: '#F5F3EE',
    D: '#F5C518',
    F: '#3C8C5E',
    B: '#1D5C9E',
    R: '#D7263D',
    L: '#F26430',
  };
  const BODY_COLOR = '#101114';

  const AXIS_VECTORS = {
    x: new THREE.Vector3(1, 0, 0),
    y: new THREE.Vector3(0, 1, 0),
    z: new THREE.Vector3(0, 0, 1),
  };

  const AXIS_LAYER_NAMES = {
    x: { '1': 'R', '-1': 'L', '0': 'M' },
    y: { '1': 'U', '-1': 'D', '0': 'E' },
    z: { '1': 'F', '-1': 'B', '0': 'S' },
  };
  function moveLabel(axis, layer, angle) {
    const base = AXIS_LAYER_NAMES[axis][String(layer)];
    return angle < 0 ? base : base + '\u2032';
  }

  const COLUMN_TINT = 0x4fb6a8;
  const ROW_TINT = 0xe0a458;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function roundedRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function makeStickerTexture(hexColor) {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = hexColor;
    roundedRectPath(ctx, 6, 6, size - 12, size - 12, 20);
    ctx.fill();
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
  }

  function makeArrowTexture() {
    const size = 160;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    const midY = size / 2;
    ctx.strokeStyle = '#F4FBFA';
    ctx.fillStyle = '#F4FBFA';
    ctx.lineWidth = 16;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(16, midY);
    ctx.lineTo(104, midY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(92, midY - 30);
    ctx.lineTo(148, midY);
    ctx.lineTo(92, midY + 30);
    ctx.closePath();
    ctx.fill();
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
  }

  const container = document.getElementById('cube-container');
  const instructionsEl = document.getElementById('instructions');
  const lastMoveEl = document.getElementById('last-move');
  const resetBtn = document.getElementById('reset-btn');
  const shuffleBtn = document.getElementById('shuffle-btn');

  const DEFAULT_INSTRUCTIONS = 'キューブのステッカーをタップすると、その列(青緑)と行(黄土色)がハイライトされ、上下左右の矢印が表示されます。ドラッグでビューを回転、ホイールで拡大縮小できます。';
  const SELECTED_INSTRUCTIONS = '列(青緑)と行(黄土色)がハイライトされています。上下左右いずれかの矢印をタップすると回転します。';

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const dom = renderer.domElement;
  container.appendChild(dom);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x202030, 0.65));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
  fillLight.position.set(-6, -3, -4);
  scene.add(fillLight);

  const cubeRoot = new THREE.Group();
  scene.add(cubeRoot);

  const textureCache = {};
  function getTexture(hex) {
    if (!textureCache[hex]) textureCache[hex] = makeStickerTexture(hex);
    return textureCache[hex];
  }

  const bodyGeometry = new THREE.BoxGeometry(0.94, 0.94, 0.94);
  const bodyMaterial = new THREE.MeshStandardMaterial({
    color: BODY_COLOR,
    roughness: 0.65,
    metalness: 0.05,
  });
  const stickerGeometry = new THREE.PlaneGeometry(0.8, 0.8);
  const stickerOffset = 0.475;

  const allCubies = [];
  let stickerMeshes = [];
  let animating = false;

  function addSticker(cubie, faceKey, normal) {
    const material = new THREE.MeshStandardMaterial({
      map: getTexture(FACE_COLORS[faceKey]),
      transparent: true,
      roughness: 0.45,
      metalness: 0,
    });
    const mesh = new THREE.Mesh(stickerGeometry, material);
    mesh.position.copy(normal.clone().multiplyScalar(stickerOffset));
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    cubie.add(mesh);
  }

  function buildCube() {
    for (const c of [...allCubies]) {
      cubeRoot.remove(c);
      c.traverse((obj) => {
        if (obj.material && (obj.geometry === stickerGeometry || obj.geometry === bodyGeometry)) {
          obj.material.dispose();
        }
      });
    }
    allCubies.length = 0;

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          if (x === 0 && y === 0 && z === 0) continue;
          const cubie = new THREE.Group();
          cubie.position.set(x, y, z);
          cubie.add(new THREE.Mesh(bodyGeometry, bodyMaterial.clone()));
          if (x === 1) addSticker(cubie, 'R', new THREE.Vector3(1, 0, 0));
          if (x === -1) addSticker(cubie, 'L', new THREE.Vector3(-1, 0, 0));
          if (y === 1) addSticker(cubie, 'U', new THREE.Vector3(0, 1, 0));
          if (y === -1) addSticker(cubie, 'D', new THREE.Vector3(0, -1, 0));
          if (z === 1) addSticker(cubie, 'F', new THREE.Vector3(0, 0, 1));
          if (z === -1) addSticker(cubie, 'B', new THREE.Vector3(0, 0, -1));
          cubeRoot.add(cubie);
          allCubies.push(cubie);
        }
      }
    }

    stickerMeshes = [];
    allCubies.forEach((c) => {
      c.children.forEach((child) => {
        if (child.geometry === stickerGeometry) stickerMeshes.push(child);
      });
    });
  }

  buildCube();

  // --- direction arrows: tap a sticker -> up/down/left/right appear around it ---
  const arrowTexture = makeArrowTexture();
  const arrowKeys = ['up', 'down', 'left', 'right'];
  const arrowRotations = { up: Math.PI / 2, down: -Math.PI / 2, left: Math.PI, right: 0 };
  const arrowOffsets = {
    up: new THREE.Vector3(0, 0.42, 0),
    down: new THREE.Vector3(0, -0.42, 0),
    left: new THREE.Vector3(-0.42, 0, 0),
    right: new THREE.Vector3(0.42, 0, 0),
  };
  const arrowSprites = {};
  arrowKeys.forEach((key) => {
    const material = new THREE.SpriteMaterial({
      map: arrowTexture,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      rotation: arrowRotations[key],
    });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(0.4, 0.4, 1);
    sprite.renderOrder = 999;
    sprite.visible = false;
    scene.add(sprite);
    arrowSprites[key] = sprite;
  });
  const arrowSpriteList = arrowKeys.map((k) => arrowSprites[k]);

  function setLayerEmissive(axis, layer, on, color) {
    allCubies.forEach((c) => {
      if (Math.round(c.position[axis]) === layer) {
        c.traverse((obj) => {
          if (obj.material && obj.material.emissive) {
            obj.material.emissive.set(on ? color : 0x000000);
            obj.material.emissiveIntensity = on ? 0.55 : 0;
          }
        });
      }
    });
  }

  let currentSelection = null;
  function clearSelection() {
    if (currentSelection) {
      setLayerEmissive(currentSelection.colAxis, currentSelection.colLayer, false);
      setLayerEmissive(currentSelection.rowAxis, currentSelection.rowLayer, false);
    }
    arrowSpriteList.forEach((s) => { s.visible = false; });
    currentSelection = null;
    currentMoves = null;
    dpad.classList.remove('visible');
    instructionsEl.textContent = DEFAULT_INSTRUCTIONS;
  }

  const dpad = document.getElementById('dpad');
  const dpadButtons = {
    up: document.getElementById('dpad-up'),
    down: document.getElementById('dpad-down'),
    left: document.getElementById('dpad-left'),
    right: document.getElementById('dpad-right'),
  };
  let currentMoves = null;

  function angularVelocity(axis, sign, point) {
    const omega = new THREE.Vector3();
    omega[axis] = sign;
    return omega.clone().cross(point);
  }

  function selectSticker(hit) {
    const mesh = hit.object;
    const cubie = mesh.parent;

    const worldNormal = new THREE.Vector3(0, 0, 1).transformDirection(mesh.matrixWorld);
    const axes = ['x', 'y', 'z'];
    let faceAxis = 'y';
    axes.forEach((a) => {
      if (Math.abs(worldNormal[a]) > 0.5) faceAxis = a;
    });
    const otherAxes = axes.filter((a) => a !== faceAxis);
    const colAxis = otherAxes[0];
    const rowAxis = otherAxes[1];
    const colLayer = Math.round(cubie.position[colAxis]);
    const rowLayer = Math.round(cubie.position[rowAxis]);

    const point = hit.point.clone();
    const normalNudge = new THREE.Vector3(
      Math.round(worldNormal.x),
      Math.round(worldNormal.y),
      Math.round(worldNormal.z)
    ).multiplyScalar(0.16);

    // Figure out which rotation sign actually moves THIS tapped point up
    // vs down, and left vs right, instead of assuming a fixed sign -
    // the true direction depends on where on the cube you tapped.
    const velColPlus = angularVelocity(colAxis, 1, point);
    const velColMinus = angularVelocity(colAxis, -1, point);
    const upAngle = velColPlus.y >= velColMinus.y ? Math.PI / 2 : -Math.PI / 2;
    const downAngle = -upAngle;

    const velRowPlus = angularVelocity(rowAxis, 1, point);
    const velRowMinus = angularVelocity(rowAxis, -1, point);
    const rightAngle = velRowPlus.x >= velRowMinus.x ? Math.PI / 2 : -Math.PI / 2;
    const leftAngle = -rightAngle;

    const moves = {
      up: { axis: colAxis, layer: colLayer, angle: upAngle },
      down: { axis: colAxis, layer: colLayer, angle: downAngle },
      left: { axis: rowAxis, layer: rowLayer, angle: leftAngle },
      right: { axis: rowAxis, layer: rowLayer, angle: rightAngle },
    };

    arrowKeys.forEach((key) => {
      const sprite = arrowSprites[key];
      sprite.position.copy(point).add(normalNudge).add(arrowOffsets[key]);
      sprite.userData.move = moves[key];
      sprite.visible = true;
    });

    setLayerEmissive(colAxis, colLayer, true, COLUMN_TINT);
    setLayerEmissive(rowAxis, rowLayer, true, ROW_TINT);
    currentSelection = { colAxis, colLayer, rowAxis, rowLayer };
    currentMoves = moves;
    dpad.classList.add('visible');
    instructionsEl.textContent = SELECTED_INSTRUCTIONS;
  }

  function snapCubie(cubie) {
    cubie.position.set(
      Math.round(cubie.position.x),
      Math.round(cubie.position.y),
      Math.round(cubie.position.z)
    );
    const m = new THREE.Matrix4().makeRotationFromQuaternion(cubie.quaternion);
    const el = m.elements;
    [0, 1, 2, 4, 5, 6, 8, 9, 10].forEach((i) => {
      el[i] = Math.round(el[i]);
    });
    cubie.quaternion.setFromRotationMatrix(m);
  }

  function setAnimating(v) {
    animating = v;
    resetBtn.disabled = v;
    shuffleBtn.disabled = v;
  }

  function performMove(axis, layer, angle, options) {
    options = options || {};
    if (animating && !options.chained) return;
    if (!options.chained) setAnimating(true);
    if (!options.silent) {
      lastMoveEl.textContent = '\u6700\u5f8c\u306e\u64cd\u4f5c: ' + moveLabel(axis, layer, angle);
    }

    const layerCubies = allCubies.filter((c) => Math.round(c.position[axis]) === layer);
    setLayerEmissive(axis, layer, true, COLUMN_TINT);
    const pivot = new THREE.Group();
    cubeRoot.add(pivot);
    layerCubies.forEach((c) => pivot.attach(c));

    const axisVec = AXIS_VECTORS[axis];
    const duration = options.duration || 230;
    const start = performance.now();

    function step(now) {
      const progress = Math.min(1, (now - start) / duration);
      const eased = easeOutCubic(progress);
      pivot.quaternion.setFromAxisAngle(axisVec, angle * eased);
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        layerCubies.forEach((c) => {
          cubeRoot.attach(c);
          snapCubie(c);
        });
        setLayerEmissive(axis, layer, false);
        cubeRoot.remove(pivot);
        if (!options.chained) setAnimating(false);
        if (options.onComplete) options.onComplete();
      }
    }
    requestAnimationFrame(step);
  }

  function scrambleCube(count) {
    if (animating) return;
    clearSelection();
    setAnimating(true);
    const axes = ['x', 'y', 'z'];
    let lastAxis = null;
    let lastLayer = null;
    const moves = [];
    for (let i = 0; i < count; i++) {
      let axis, layer;
      do {
        axis = axes[Math.floor(Math.random() * 3)];
        layer = Math.random() < 0.5 ? 1 : -1;
      } while (axis === lastAxis && layer === lastLayer);
      lastAxis = axis;
      lastLayer = layer;
      const angle = Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2;
      moves.push({ axis, layer, angle });
    }
    let idx = 0;
    lastMoveEl.textContent = '\u30b7\u30e3\u30c3\u30d5\u30eb\u4e2d...';
    function next() {
      if (idx >= moves.length) {
        setAnimating(false);
        lastMoveEl.textContent = '\u30b7\u30e3\u30c3\u30d5\u30eb\u5b8c\u4e86(' + count + '\u624b)';
        return;
      }
      const mv = moves[idx++];
      performMove(mv.axis, mv.layer, mv.angle, { chained: true, silent: true, duration: 140, onComplete: next });
    }
    next();
  }

  resetBtn.addEventListener('click', () => {
    if (animating) return;
    clearSelection();
    buildCube();
    lastMoveEl.textContent = '\u64cd\u4f5c\u306a\u3057';
  });

  shuffleBtn.addEventListener('click', () => {
    scrambleCube(20);
  });

  Object.keys(dpadButtons).forEach((key) => {
    dpadButtons[key].addEventListener('click', () => {
      if (!currentMoves) return;
      const mv = currentMoves[key];
      clearSelection();
      performMove(mv.axis, mv.layer, mv.angle);
    });
  });

  // --- camera orbit ---
  let azimuth = Math.PI / 4;
  let polar = Math.PI / 3;
  let radius = 6.4;
  function updateCameraPosition() {
    camera.position.x = radius * Math.sin(polar) * Math.sin(azimuth);
    camera.position.y = radius * Math.cos(polar);
    camera.position.z = radius * Math.sin(polar) * Math.cos(azimuth);
    camera.lookAt(0, 0, 0);
  }
  updateCameraPosition();

  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  function getNDC(clientX, clientY) {
    const rect = dom.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * 2 - 1,
      y: -(((clientY - rect.top) / rect.height) * 2 - 1),
    };
  }

  function handleTap(clientX, clientY) {
    if (animating) return;
    const ndc = getNDC(clientX, clientY);
    pointerNDC.set(ndc.x, ndc.y);
    raycaster.setFromCamera(pointerNDC, camera);

    if (currentSelection) {
      const arrowHits = raycaster.intersectObjects(arrowSpriteList);
      if (arrowHits.length > 0) {
        const mv = arrowHits[0].object.userData.move;
        clearSelection();
        performMove(mv.axis, mv.layer, mv.angle);
        return;
      }
    }

    const stickerHits = raycaster.intersectObjects(stickerMeshes);
    if (stickerHits.length > 0) {
      clearSelection();
      selectSticker(stickerHits[0]);
      return;
    }

    clearSelection();
  }

  let dragged = false;
  let prevX = 0;
  let prevY = 0;
  const DRAG_THRESHOLD = 6;
  const MIN_RADIUS = 4.5;
  const MAX_RADIUS = 10;

  const activePointers = new Map();
  let pinchStartDistance = 0;
  let pinchStartRadius = radius;

  function pointerDistance() {
    const pts = [...activePointers.values()];
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  dom.addEventListener('pointerdown', (e) => {
    dom.setPointerCapture && dom.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePointers.size === 1) {
      dragged = false;
      prevX = e.clientX;
      prevY = e.clientY;
      container.style.cursor = 'grabbing';
    } else if (activePointers.size === 2) {
      dragged = true; // a pinch should never register as a tap
      pinchStartDistance = pointerDistance();
      pinchStartRadius = radius;
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size === 2) {
      const dist = pointerDistance();
      if (pinchStartDistance > 0) {
        const scale = dist / pinchStartDistance;
        radius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, pinchStartRadius / scale));
        updateCameraPosition();
      }
      return;
    }

    if (activePointers.size === 1) {
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      if (Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) dragged = true;
      prevX = e.clientX;
      prevY = e.clientY;
      azimuth -= dx * 0.006;
      polar -= dy * 0.006;
      polar = Math.max(0.25, Math.min(Math.PI - 0.25, polar));
      updateCameraPosition();
    }
  });

  function endPointer(e) {
    const wasSingle = activePointers.size === 1;
    activePointers.delete(e.pointerId);
    if (wasSingle && !dragged) {
      handleTap(e.clientX, e.clientY);
    }
    if (activePointers.size === 1) {
      // transitioning from a pinch back to a single touch: resync so it
      // doesn't jump, and don't treat the remaining touch as a fresh tap
      const [remaining] = [...activePointers.values()];
      prevX = remaining.x;
      prevY = remaining.y;
      dragged = true;
    }
    if (activePointers.size === 0) {
      container.style.cursor = 'grab';
    }
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  dom.addEventListener('wheel', (e) => {
    e.preventDefault();
    radius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, radius + e.deltaY * 0.003));
    updateCameraPosition();
  }, { passive: false });

  function resize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    if (w === 0 || h === 0) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  resize();
  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(container);

  function renderLoop() {
    renderer.render(scene, camera);
    requestAnimationFrame(renderLoop);
  }
  renderLoop();
})();
</script>
</body>
</html>
